<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | ذاكرة الأندلس</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            padding-left: 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            outline: none;
            direction: ltr;
            text-align: right;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            top: 38px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }

        button.submit-btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--error);
            font-size: 14px;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .lock-timer {
            font-size: 14px;
            color: #64748b;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card" id="loginCard">
        <img src="https://alandalus.edu.sa/wp-content/uploads/2023/05/logo-1.png" alt="Logo" class="logo">
        <h1>ذاكرة الأندلس الرقمية</h1>
        <p>يرجى إدخال كلمة المرور للوصول إلى المحتوى</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="button" class="toggle-password" id="togglePassword">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">دخول</button>
            <div class="error-msg" id="errorMsg">كلمة المرور غير صحيحة</div>
            <div class="lock-timer" id="lockTimer">المحاولة مجدداً بعد <span id="seconds">30</span> ثانية</div>
        </form>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SHARED_PASSWORD = 'alandalus2024'; 
        const MAX_ATTEMPTS = 5;
        const LOCK_TIME = 30; 

        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const errorMsg = document.getElementById('errorMsg');
        const loginCard = document.getElementById('loginCard');
        const submitBtn = document.getElementById('submitBtn');
        const lockTimer = document.getElementById('lockTimer');
        const secondsSpan = document.getElementById('seconds');

        function checkLock() {
            const lockUntil = sessionStorage.getItem('lock_until');
            if (lockUntil) {
                const remaining = Math.ceil((parseInt(lockUntil) - Date.now()) / 1000);
                if (remaining > 0) {
                    startLock(remaining);
                } else {
                    sessionStorage.removeItem('lock_until');
                    sessionStorage.setItem('failed_attempts', '0');
                }
            }
        }

        function startLock(seconds) {
            submitBtn.disabled = true;
            lockTimer.style.display = 'block';
            errorMsg.style.display = 'none';
            
            let timeLeft = seconds;
            secondsSpan.textContent = timeLeft;

            const interval = setInterval(() => {
                timeLeft--;
                secondsSpan.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    submitBtn.disabled = false;
                    lockTimer.style.display = 'none';
                    sessionStorage.removeItem('lock_until');
                    sessionStorage.setItem('failed_attempts', '0');
                }
            }, 1000);
        }

        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = passwordInput.value;

            if (password === SHARED_PASSWORD) {
                sessionStorage.setItem('is_authenticated', 'true');
                window.location.href = '/index.html';
            } else {
                let attempts = parseInt(sessionStorage.getItem('failed_attempts') || '0');
                attempts++;
                sessionStorage.setItem('failed_attempts', attempts.toString());

                errorMsg.style.display = 'block';
                loginCard.classList.add('shake');
                setTimeout(() => loginCard.classList.remove('shake'), 500);

                if (attempts >= MAX_ATTEMPTS) {
                    const lockUntil = Date.now() + (LOCK_TIME * 1000);
                    sessionStorage.setItem('lock_until', lockUntil.toString());
                    startLock(LOCK_TIME);
                }
            }
        });

        checkLock();
    </script>
</body>
</html>
